name: Statutory cancellation PHPUnit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/Console/Commands/StatutoryCancellationReconcileCommand.php'
      - 'app/Enums/StatutoryInvoiceCancellationOperationStatus.php'
      - 'app/Http/Controllers/Finance/StatutoryInvoiceController.php'
      - 'app/Models/StatutoryInvoiceCancellation.php'
      - 'app/Services/StatutoryInvoice/Data/IrnCancellationReconciliationResult.php'
      - 'app/Services/StatutoryInvoice/Data/StatutoryInvoiceCancellationAdminContext.php'
      - 'app/Services/StatutoryInvoice/StatutoryInvoiceCancellation*.php'
      - 'app/Services/StatutoryInvoice/StatutoryInvoiceIrnCancellation*.php'
      - 'app/Services/StatutoryInvoice/Whitebooks/WhitebooksResponseMapper.php'
      - 'app/Support/Finance/FinanceAccess.php'
      - 'config/statutory_invoices.php'
      - 'database/migrations/*statutory_invoice_cancellations*'
      - 'database/seeders/RolePermissionSeeder.php'
      - 'resources/views/finance/invoices/show.blade.php'
      - 'tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellation*.php'
      - 'tests/Feature/StatutoryInvoice/StatutoryCancellationWorkflowTest.php'
      - 'tests/Feature/StatutoryInvoice/WhitebooksEInvoiceGatewayTest.php'
      - 'tests/Unit/StatutoryInvoice/StatutoryInvoiceCancellation*.php'
      - 'tests/Unit/StatutoryInvoice/DeskServiceConsultancySac998312ClassificationTest.php'
      - 'tests/Unit/StatutoryInvoice/ServiceStatutoryClassificationTest.php'
      - 'tests/Unit/StatutoryInvoice/EInvoiceUqcMapperTest.php'
      - 'tests/Unit/StatutoryInvoice/ServiceSacResolverTest.php'
      - 'tests/Feature/ServicePos/ServicePosEinvoiceParityTest.php'
      - 'tests/Support/FakeEInvoiceGateway.php'
      - '.github/workflows/statutory-cancellation-phpunit.yml'
  push:
    branches:
      - main
    paths:
      - 'app/Console/Commands/StatutoryCancellationReconcileCommand.php'
      - 'app/Enums/StatutoryInvoiceCancellationOperationStatus.php'
      - 'app/Http/Controllers/Finance/StatutoryInvoiceController.php'
      - 'app/Models/StatutoryInvoiceCancellation.php'
      - 'app/Services/StatutoryInvoice/Data/IrnCancellationReconciliationResult.php'
      - 'app/Services/StatutoryInvoice/Data/StatutoryInvoiceCancellationAdminContext.php'
      - 'app/Services/StatutoryInvoice/StatutoryInvoiceCancellation*.php'
      - 'app/Services/StatutoryInvoice/StatutoryInvoiceIrnCancellation*.php'
      - 'app/Services/StatutoryInvoice/Whitebooks/WhitebooksResponseMapper.php'
      - 'app/Support/Finance/FinanceAccess.php'
      - 'config/statutory_invoices.php'
      - 'database/migrations/*statutory_invoice_cancellations*'
      - 'database/seeders/RolePermissionSeeder.php'
      - 'resources/views/finance/invoices/show.blade.php'
      - 'tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellation*.php'
      - 'tests/Feature/StatutoryInvoice/StatutoryCancellationWorkflowTest.php'
      - 'tests/Feature/StatutoryInvoice/WhitebooksEInvoiceGatewayTest.php'
      - 'tests/Unit/StatutoryInvoice/StatutoryInvoiceCancellation*.php'
      - 'tests/Unit/StatutoryInvoice/DeskServiceConsultancySac998312ClassificationTest.php'
      - 'tests/Unit/StatutoryInvoice/ServiceStatutoryClassificationTest.php'
      - 'tests/Unit/StatutoryInvoice/EInvoiceUqcMapperTest.php'
      - 'tests/Unit/StatutoryInvoice/ServiceSacResolverTest.php'
      - 'tests/Feature/ServicePos/ServicePosEinvoiceParityTest.php'
      - 'tests/Support/FakeEInvoiceGateway.php'
      - '.github/workflows/statutory-cancellation-phpunit.yml'

permissions:
  contents: read

jobs:
  statutory-cancellation-phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end assets (Service POS HTTP feature tests)
        run: npm ci && npm run build

      - name: PHPUnit (statutory invoice cancellation focused bundle)
        run: |
          ./vendor/bin/phpunit \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationIrnPendingRecoveryTest.php \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationAdminUiTest.php \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationOrchestratorTest.php \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationReliabilityTest.php \
            tests/Feature/StatutoryInvoice/StatutoryCancellationWorkflowTest.php \
            tests/Unit/StatutoryInvoice/StatutoryInvoiceCancellationDispatchReservationTest.php \
            tests/Feature/StatutoryInvoice/WhitebooksEInvoiceGatewayTest.php

      - name: PHPUnit (desk service SAC 998312 classification regression)
        run: |
          ./vendor/bin/phpunit \
            tests/Unit/StatutoryInvoice/DeskServiceConsultancySac998312ClassificationTest.php \
            tests/Unit/StatutoryInvoice/ServiceStatutoryClassificationTest.php \
            tests/Feature/ServicePos/ServicePosEinvoiceParityTest.php \
            tests/Unit/StatutoryInvoice/EInvoiceUqcMapperTest.php \
            tests/Unit/StatutoryInvoice/ServiceSacResolverTest.php
