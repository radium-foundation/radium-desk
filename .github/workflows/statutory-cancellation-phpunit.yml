      - '.github/workflows/statutory-cancellation-phpunit.yml'

permissions:
  contents: read

jobs:
  statutory-cancellation-phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: imagick, zip, gd, sqlite3, mbstring, xml, curl, intl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end assets (Service POS HTTP feature tests)
        run: npm ci && npm run build

      - name: PHPUnit (statutory invoice cancellation focused bundle)
        run: |
          ./vendor/bin/phpunit \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationIrnPendingRecoveryTest.php \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationAdminUiTest.php \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationOrchestratorTest.php \
            tests/Feature/StatutoryInvoice/StatutoryInvoiceCancellationReliabilityTest.php \
            tests/Feature/StatutoryInvoice/StatutoryCancellationWorkflowTest.php \
            tests/Unit/StatutoryInvoice/StatutoryInvoiceCancellationDispatchReservationTest.php \
            tests/Feature/StatutoryInvoice/WhitebooksEInvoiceGatewayTest.php

      - name: PHPUnit (statutory billing address remediation)
        run: |
          ./vendor/bin/phpunit \
            tests/Unit/StatutoryInvoice/StatutoryBillingAddressComposerTest.php \
            tests/Feature/StatutoryInvoice/StatutoryBillingAddressRemediationTest.php \
            tests/Feature/HardwareFulfilment/HardwareFulfilmentInvoiceHttpTest.php \
            --filter 'StatutoryBillingAddress|dashboard_json_issues_invoice_when_commerce|dashboard_json_billing_address_over_limit|dashboard_json_post_issues|dashboard_json_validation_failure'

      - name: PHPUnit (desk service SAC 998312 classification regression)
        run: |
          ./vendor/bin/phpunit \
            tests/Unit/StatutoryInvoice/DeskServiceConsultancySac998312ClassificationTest.php \
            tests/Unit/StatutoryInvoice/ServiceStatutoryClassificationTest.php \
            tests/Feature/ServicePos/ServicePosEinvoiceParityTest.php \
            tests/Unit/StatutoryInvoice/EInvoiceUqcMapperTest.php \
            tests/Unit/StatutoryInvoice/ServiceSacResolverTest.php

      - name: PHPUnit (rdservice.net statutory auto-issuance gate)
        run: |
          ./vendor/bin/phpunit \
            tests/Feature/StatutoryInvoice/ServiceStatutoryAutoIssuancePolicyTest.php \
            tests/Feature/StatutoryInvoice/ServiceStatutoryInvoiceMintRetryTest.php

      - name: PHPUnit (RadiumBox statutory receipt publisher)
        run: |
          ./vendor/bin/phpunit \
            tests/Feature/RadiumBox/RadiumBoxStatutoryReceiptPublicationTest.php \
            tests/Feature/RadiumBox/RadiumBoxStatutoryReceiptPublishAllowlistTest.php \
            tests/Feature/RadiumBox/RadiumBoxStatutoryReceiptRequeueAwaitingCommandTest.php \
            tests/Feature/RadiumBox/RadiumBoxStatutoryReceiptPublicationMigrationTest.php \
            tests/Unit/RadiumBox/RadiumBoxStatutoryReceiptPublicationPolicyTest.php \
            tests/Unit/RadiumBox/RadiumBoxStatutoryInvoiceReceiptApiContractTest.php

      - name: PHPUnit (RadiumBox wallet reversal + desk-first revoke routing)
        run: |
          ./vendor/bin/phpunit \
            tests/Unit/RadiumBox/RadiumBoxWalletRefundReversalClientTest.php \
            tests/Feature/CentralWallet/DeskFirstWalletRefundRevokeSpokeRoutingTest.php \
            tests/Feature/CentralWallet/DeskFirstWalletRefundRevokeFlagOffRegressionTest.php
